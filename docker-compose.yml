# Sab kuch ek command se:  docker compose up -d --build
# Phir browser mein kholein: http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/fitness-tracker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ko project ki .env file mein set karein}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGIN: http://localhost:8080
      CLIENT_URL: http://localhost:8080
      TRUST_PROXY: 1
      LOG_LEVEL: info
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    volumes:
      - backup-data:/app/backups

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  backup-data: